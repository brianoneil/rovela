<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rovela — Your Journey, Remembered</title>
  <meta name="description" content="Rovela. A beautiful record of every adventure. Coming soon.">
  <link rel="canonical" href="https://getrovela.com/">
  <meta property="og:title" content="Rovela">
  <meta property="og:description" content="Your journey, remembered. Coming soon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://getrovela.com/">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f0e;
      --surface: #151916;
      --accent: #c8a96e;
      --accent2: #7a9e7e;
      --text: #ede8e0;
      --muted: #6b6b60;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      text-align: center;
      overflow: hidden;
    }

    /* Terrain-like gradient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      animation: drift 16s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #7a9e7e, transparent);
      top: -150px; left: -150px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, #c8a96e, transparent);
      bottom: -120px; right: -100px;
      animation-delay: -8s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 520px;
    }

    .logo {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.25rem;
      opacity: 0.85;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--text) 50%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1.1rem;
      border: 1px solid rgba(200, 169, 110, 0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(200, 169, 110, 0.06);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.7rem;
      color: var(--muted);
      opacity: 0.4;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="content">
    <div class="logo">Rovela</div>
    <h1>Every journey, told beautifully.</h1>
    <p>Your trips — the routes, the photos, the moments — stitched together into a story worth keeping.</p>
    <span class="badge">Coming Soon</span>
  </div>

  <footer>getrovela.com</footer>
</body>
</html>
